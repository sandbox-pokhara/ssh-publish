[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-publish"
requires-python = ">=3.11"
authors = [
  { name = "Pradish Bijukchhe", email = "pradish@sandbox.com.np" },
]
description = "Publish python packages to VPS via SSH. This project simplifies the process of uploading and managing python packages on your self-hosted package repository."
readme = "README.md"
license = "MIT"
keywords = []
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["paramiko", "rich"]
dynamic = ["version"]

[project.optional-dependencies]
pre-commit = ["pre-commit"]

[project.scripts]
ssh-publish = "ssh_publish.__main__:main"

[project.urls]
Homepage = "https://github.com/sandbox-pokhara/ssh-publish"
Issues = "https://github.com/sandbox-pokhara/ssh-publish/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"ssh_publish" = "ssh_publish"

[tool.setuptools.dynamic]
version = { attr = "ssh_publish.version.__version__" }

[tool.ruff.lint]
select = ["I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["ssh_publish", "test.py"]
typeCheckingMode = "strict"
